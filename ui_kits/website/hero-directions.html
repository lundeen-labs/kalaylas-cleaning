<!-- @dsCard group="Website" viewport="1280x900" name="Hero directions (3)" subtitle="Three directions for the homepage hero — pick one to run with." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero directions — Kalayla's</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="site.css">
<style>
  body { margin: 0; background: var(--neutral-100); }
  .dwrap { max-width: 1240px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 40px; }
  .dframe { background: var(--surface-card); border-radius: var(--radius-2xl); box-shadow: var(--elevation-card); overflow: hidden; border: 1px solid var(--border-subtle); }
  .dlabel { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--border-subtle); }
  .dlabel b { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text-heading); }
  .dlabel span { font-size: 13px; color: var(--text-muted); }
  .dbody { padding: 8px; }
  .pagehd { text-align: center; margin-bottom: 8px; }
  .pagehd h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: var(--text-heading); margin: 0; }
  .pagehd p { color: var(--text-muted); margin: 8px 0 0; }

  /* B — centered */
  .hb { text-align: center; padding: 64px 32px 0; }
  .hb__title { font-family: var(--font-display); font-weight: 800; font-size: clamp(38px,5vw,60px); line-height: 1.04; letter-spacing: -0.03em; color: var(--text-heading); margin: 16px auto 0; max-width: 760px; text-wrap: balance; }
  .hb__sub { font-size: 18px; color: var(--text-muted); margin: 18px auto 0; max-width: 520px; }
  .hb__band { position: relative; margin: 40px 16px 16px; border-radius: var(--radius-2xl); overflow: hidden; aspect-ratio: 24/9; }
  .hb__stat { position: absolute; left: 24px; bottom: 22px; background: color-mix(in srgb, var(--surface-card) 88%, transparent); backdrop-filter: blur(10px); border-radius: var(--radius-lg); padding: 14px 18px; display: flex; gap: 26px; }

  /* C — personal deep */
  .hc { background: var(--surface-inverse); border-radius: var(--radius-xl); display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 40px; align-items: center; padding: 44px; }
  .hc__title { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px,4.5vw,52px); line-height: 1.05; letter-spacing: -0.03em; color: #fff; margin: 14px 0 0; }
  .hc__title u { text-decoration: none; box-shadow: inset 0 -0.32em 0 color-mix(in srgb, var(--accent) 70%, transparent); }
  .hc__sub { color: var(--text-on-deep); font-size: 17px; line-height: 1.55; margin: 18px 0 0; max-width: 440px; }
  .hc__intro { display: flex; align-items: center; gap: 12px; margin-top: 26px; }
  .hc__intro b { color: #fff; font-size: 14px; }
  .hc__intro span { color: var(--text-on-deep-muted); font-size: 13px; display: block; }
  @media (max-width: 820px){ .hc { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Logo, Button, Icon, Rating, Avatar, Badge, Stat } = window.KalaylaSCleaningDesignSystem_b83ec6;

function Frame({ tag, name, note, children }) {
  return (
    <div className="dframe">
      <div className="dlabel"><Badge tone="brand" solid>{tag}</Badge><b>{name}</b><span>{note}</span></div>
      <div className="dbody">{children}</div>
    </div>
  );
}

function DirA() {
  return (
    <div className="section hero" style={{ paddingTop: 40, paddingBottom: 56 }}>
      <div className="container">
        <div className="hero__grid">
          <div>
            <span className="eyebrow">Serving Mount Vernon &amp; Skagit Valley</span>
            <h1 className="hero__title" style={{ fontSize: 54 }}>A spotless home, without lifting a finger.</h1>
            <p className="hero__sub">Trusted, insured cleaners for homes and offices — the same friendly, bilingual team, every visit.</p>
            <div className="hero__cta">
              <Button size="lg" leadingIcon={<Icon name="sparkles" size={20} />}>Get a free quote</Button>
              <Button size="lg" variant="secondary">See what's included</Button>
            </div>
            <div className="hero__trust">
              <span className="trustitem"><Icon name="shield-check" size={18} /> Licensed &amp; insured</span>
              <span className="trustitem"><Icon name="messages-square" size={18} /> English &amp; Español</span>
            </div>
          </div>
          <div className="hero__media">
            <div className="hero__glow"></div>
            <div className="photo photo--ratio" style={{ position: 'relative', zIndex: 1 }}>
              <div className="photo__mark"><svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M21 8 Q24.5 23.5 40 27 Q24.5 30.5 21 46 Q17.5 30.5 2 27 Q17.5 23.5 21 8 Z" fill="#2FC1B2"/><path d="M39 4 Q40.5 10.5 47 12 Q40.5 13.5 39 20 Q37.5 13.5 31 12 Q37.5 10.5 39 4 Z" fill="#10B5A6"/></svg><span className="photo__cap">Bright, tidy home</span></div>
            </div>
            <div className="floatcard floatcard--tl"><Rating value={5} size={15} /><div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-muted)', marginTop: 5 }}>214 five-star reviews</div></div>
            <div className="floatcard floatcard--br"><Avatar name="Kalayla Ramirez" size="md" ring /><div><div style={{ fontWeight: 600, fontSize: 14, color: 'var(--text-heading)' }}>Your team is booked</div><div style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>Tue 9:00 AM · Kalayla + Ana</div></div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DirB() {
  return (
    <div className="hb">
      <span className="eyebrow">Homes &amp; offices · Skagit Valley</span>
      <h2 className="hb__title">Come home to clean.</h2>
      <p className="hb__sub">Trusted, insured, bilingual cleaning — booked in two minutes, guaranteed every visit.</p>
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginTop: 26 }}>
        <Button size="lg" leadingIcon={<Icon name="sparkles" size={20} />}>Get a free quote</Button>
        <Button size="lg" variant="outline" leadingIcon={<Icon name="phone" size={18} />}>(360) 555-0142</Button>
      </div>
      <div className="hb__band photo photo--wide">
        <div className="photo__mark"><svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M21 8 Q24.5 23.5 40 27 Q24.5 30.5 21 46 Q17.5 30.5 2 27 Q17.5 23.5 21 8 Z" fill="#2FC1B2"/><path d="M39 4 Q40.5 10.5 47 12 Q40.5 13.5 39 20 Q37.5 13.5 31 12 Q37.5 10.5 39 4 Z" fill="#10B5A6"/></svg><span className="photo__cap">Full-bleed home photo</span></div>
        <div className="hb__stat"><Stat value="500+" label="Homes cleaned" /><Stat value="4.9★" label="Rating" /><Stat value="12 yrs" label="Local" /></div>
      </div>
    </div>
  );
}

function DirC() {
  return (
    <div className="hc">
      <div className="photo photo--ratio">
        <div className="photo__mark"><svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M21 8 Q24.5 23.5 40 27 Q24.5 30.5 21 46 Q17.5 30.5 2 27 Q17.5 23.5 21 8 Z" fill="#34C2B3"/><path d="M39 4 Q40.5 10.5 47 12 Q40.5 13.5 39 20 Q37.5 13.5 31 12 Q37.5 10.5 39 4 Z" fill="#CFF3EE"/></svg><span className="photo__cap" style={{ color: 'var(--teal-200)' }}>Owner &amp; team photo</span></div>
      </div>
      <div>
        <span className="eyebrow">Family-owned in Mount Vernon</span>
        <h2 className="hc__title">Cleaning your home like it's <u>our own</u>.</h2>
        <p className="hc__sub">We're Kalayla's — a small, bilingual team that treats every home and office with the care we'd give our own family's.</p>
        <div style={{ display: 'flex', gap: 12, marginTop: 26 }}>
          <Button size="lg" leadingIcon={<Icon name="sparkles" size={20} />}>Get a free quote</Button>
          <Button size="lg" variant="ghost" style={{ color: '#fff' }} trailingIcon={<Icon name="arrow-right" size={18} />}>Meet the team</Button>
        </div>
        <div className="hc__intro">
          <Avatar name="Kalayla Ramirez" size="lg" ring />
          <div><b>Kalayla Ramirez</b><span>Owner · habla español</span></div>
        </div>
      </div>
    </div>
  );
}

function Page() {
  return (
    <div className="dwrap">
      <div className="pagehd">
        <h1>Homepage hero — three directions</h1>
        <p>Same brand system, three different feelings. Tell me which to develop into the full site.</p>
      </div>
      <Frame tag="A" name="Calm split" note="Spacious, photo-forward, floating proof — the safe, trustworthy default.">
        <DirA />
      </Frame>
      <Frame tag="B" name="Centered & confident" note="Big centered statement over a full-bleed photo band with stats.">
        <DirB />
      </Frame>
      <Frame tag="C" name="Personal & warm" note="Deep-teal, owner-led, honey accent — leans into family-owned & bilingual.">
        <DirC />
      </Frame>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
