<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 20px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); display: block; margin-bottom: 10px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Textarea, Select, Checkbox, Switch, Chip, Icon } = window.KalaylaSCleaningDesignSystem_b83ec6;
  function Demo() {
    const [type, setType] = React.useState('home');
    return (
      <>
        <div className="group cols">
          <Input label="Full name" placeholder="Jane Garcia" required />
          <Input label="Email" type="email" leadingIcon={<Icon name="mail" size={18} />} placeholder="jane@email.com" />
          <Select label="How often?" defaultValue="biweekly">
            <option value="once">One-time</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Every 2 weeks</option>
            <option value="monthly">Monthly</option>
          </Select>
          <Input label="Phone" error="Enter a valid phone number" defaultValue="555" />
        </div>
        <div className="group">
          <span className="glabel">Chips — service type</span>
          <div className="row">
            <Chip selected={type==='home'} onClick={() => setType('home')} leadingIcon={<Icon name="home" size={16} />}>Home cleaning</Chip>
            <Chip selected={type==='office'} onClick={() => setType('office')} leadingIcon={<Icon name="building-2" size={16} />}>Office cleaning</Chip>
            <Chip selected={type==='move'} onClick={() => setType('move')} leadingIcon={<Icon name="truck" size={16} />}>Move-out</Chip>
          </div>
        </div>
        <div className="group">
          <span className="glabel">Toggles</span>
          <div className="row" style={{ gap: 24 }}>
            <Checkbox label="Send appointment reminders" defaultChecked />
            <Checkbox label="I agree to the terms" />
            <Switch label="Eco-friendly products" defaultChecked />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
