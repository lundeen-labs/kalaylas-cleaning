<!-- @dsCard group="Components" viewport="700x320" name="Actions · Button & IconButton" subtitle="Variants, sizes, icons, loading, and icon-only buttons." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 18px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); display: block; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, Icon } = window.KalaylaSCleaningDesignSystem_b83ec6;
  function Demo() {
    return (
      <>
        <div className="group">
          <span className="glabel">Variants</span>
          <div className="row">
            <Button>Get a free quote</Button>
            <Button variant="secondary">See pricing</Button>
            <Button variant="outline">Book a cleaning</Button>
            <Button variant="ghost">Learn more</Button>
          </div>
        </div>
        <div className="group">
          <span className="glabel">Sizes & icons</span>
          <div className="row">
            <Button size="sm" leadingIcon={<Icon name="phone" size={16} />}>Call</Button>
            <Button size="md" leadingIcon={<Icon name="sparkles" size={18} />}>Get started</Button>
            <Button size="lg" trailingIcon={<Icon name="arrow-right" size={20} />}>Book now</Button>
            <Button loading>Sending…</Button>
            <Button disabled>Disabled</Button>
          </div>
        </div>
        <div className="group">
          <span className="glabel">IconButton — ghost · soft · solid · outline</span>
          <div className="row">
            <IconButton label="Menu"><Icon name="menu" size={20} /></IconButton>
            <IconButton variant="soft" label="Add"><Icon name="plus" size={20} /></IconButton>
            <IconButton variant="solid" label="Call"><Icon name="phone" size={20} /></IconButton>
            <IconButton variant="outline" label="Next"><Icon name="arrow-right" size={20} /></IconButton>
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
