<!-- @dsCard group="Components" viewport="700x300" name="Brand · Logo & Icon" subtitle="Wordmark lockup variants and the Lucide icon helper." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 22px 24px; }
  .group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
  .row { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .deep { background: var(--surface-inverse); border-radius: var(--radius-lg); padding: 16px 20px; }
  .tile { width: 46px; height: 46px; border-radius: 14px; background: var(--surface-brand-soft); display: grid; place-items: center; color: var(--brand-strong); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Logo, Icon } = window.KalaylaSCleaningDesignSystem_b83ec6;
  function Demo() {
    return (
      <>
        <div className="group">
          <span className="glabel">Logo — lockup, mark, no-tagline</span>
          <div className="row">
            <Logo size={38} />
            <Logo variant="mark" size={40} />
            <Logo tagline={false} size={30} />
          </div>
        </div>
        <div className="group">
          <span className="glabel">Logo — reversed on deep teal</span>
          <div className="row">
            <div className="deep"><Logo tone="reversed" size={38} /></div>
          </div>
        </div>
        <div className="group">
          <span className="glabel">Icon — inline + feature glyph tiles</span>
          <div className="row">
            <Icon name="sparkles" size={22} color="var(--brand)" />
            <Icon name="shield-check" size={22} color="var(--text-muted)" />
            <Icon name="map-pin" size={22} color="var(--text-muted)" />
            <Icon name="star" size={22} color="var(--accent)" />
            <div className="tile"><Icon name="home" size={24} /></div>
            <div className="tile"><Icon name="building-2" size={24} /></div>
            <div className="tile"><Icon name="calendar-check" size={24} /></div>
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
