<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 20px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); display: block; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .stats { display: flex; align-items: center; gap: 40px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Avatar, Rating, Stat } = window.KalaylaSCleaningDesignSystem_b83ec6;
  function Demo() {
    return (
      <>
        <div className="group">
          <span className="glabel">Avatars & rating</span>
          <div className="row">
            <Avatar name="Kalayla Ramirez" size="sm" />
            <Avatar name="Ana Soto" size="md" />
            <Avatar name="Marta Diaz" size="lg" ring />
            <Avatar name="Jose Luna" size="xl" />
            <div style={{ width: 1, height: 40, background: 'var(--border-subtle)' }}></div>
            <Rating value={5} count={214} size={18} />
          </div>
        </div>
        <div className="group">
          <span className="glabel">Stats — trust strip</span>
          <div className="stats">
            <Stat value="500+" label="Homes cleaned" />
            <Stat value="4.9★" label="Average rating" />
            <Stat value="12 yrs" label="Serving Skagit" />
            <Stat value="100%" label="Satisfaction" />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
