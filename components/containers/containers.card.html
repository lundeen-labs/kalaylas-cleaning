<!-- @dsCard group="Components" viewport="700x280" name="Containers · Card & Tabs" subtitle="Surfaces and the pill segmented control." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 18px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); display: block; margin-bottom: 10px; }
  .row { display: flex; align-items: stretch; gap: 14px; flex-wrap: wrap; }
  .ct { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--text-heading); margin-bottom: 4px; }
  .cb { font-size: 13.5px; color: var(--text-muted); line-height: 1.45; }
  .tile { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-brand-soft); display: grid; place-items: center; color: var(--brand-strong); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Card, Tabs, Icon } = window.KalaylaSCleaningDesignSystem_b83ec6;
  function Demo() {
    const [tab, setTab] = React.useState('home');
    return (
      <>
        <div className="group">
          <span className="glabel">Tabs</span>
          <Tabs value={tab} onChange={setTab} tabs={[
            { value: 'home', label: 'Homes' },
            { value: 'office', label: 'Offices' },
            { value: 'move', label: 'Move-out' },
          ]} />
        </div>
        <div className="group">
          <span className="glabel">Cards — static & interactive</span>
          <div className="row">
            <Card style={{ width: 210 }}>
              <div className="tile"><Icon name="home" size={22} /></div>
              <div className="ct">Recurring home</div>
              <div className="cb">Weekly or biweekly visits from the same trusted team.</div>
            </Card>
            <Card interactive style={{ width: 210 }}>
              <div className="tile"><Icon name="building-2" size={22} /></div>
              <div className="ct">Office cleaning</div>
              <div className="cb">After-hours service that keeps your workplace spotless.</div>
            </Card>
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
