<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 18px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); display: block; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 10px; max-width: 440px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Badge, Alert, Icon } = window.KalaylaSCleaningDesignSystem_b83ec6;
  function Demo() {
    return (
      <>
        <div className="group">
          <span className="glabel">Badges — soft, solid, dot, icon</span>
          <div className="row">
            <Badge>Residential</Badge>
            <Badge tone="neutral" leadingIcon={<Icon name="map-pin" size={12} />}>Mount Vernon</Badge>
            <Badge tone="success" dot>Insured</Badge>
            <Badge tone="warning">2 spots left</Badge>
            <Badge tone="brand" solid>Most popular</Badge>
          </div>
        </div>
        <div className="group">
          <span className="glabel">Alerts</span>
          <div className="stack">
            <Alert tone="success" title="You're booked!">We'll text you the day before your visit — same friendly team, every time.</Alert>
            <Alert tone="info">Free quotes, no obligation. Most replies within the hour. / Cotización gratis, sin compromiso.</Alert>
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>

</html>
