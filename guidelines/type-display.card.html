<!-- @dsCard group="Type" viewport="700x180" name="Display — Schibsted Grotesk" subtitle="Confident headlines. Tight tracking, balanced wrap." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px 24px; }
  .eyebrow { font-family: var(--font-mono); font-weight: 600; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-strong); margin-bottom: 10px; }
  .d1 { font-family: var(--font-display); font-weight: 800; font-size: 46px; letter-spacing: -0.025em; line-height: 1.04; color: var(--text-heading); margin: 0; }
  .d2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.018em; color: var(--text-heading); margin: 12px 0 0; }
  .row { display: flex; gap: 20px; align-items: baseline; margin-top: 12px; }
  .w { font-family: var(--font-display); font-size: 30px; letter-spacing: -0.02em; color: var(--text-heading); }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); display: block; margin-top: 2px; }
</style>
</head>
<body>
  <div class="eyebrow">A spotless home</div>
  <h1 class="d1">Una casa impecable, sin&nbsp;mover un dedo.</h1>
  <div class="row">
    <div><span class="w" style="font-weight:400">Aa</span><span class="cap">400</span></div>
    <div><span class="w" style="font-weight:600">Aa</span><span class="cap">600</span></div>
    <div><span class="w" style="font-weight:700">Aa</span><span class="cap">700</span></div>
    <div><span class="w" style="font-weight:800">Aa</span><span class="cap">800</span></div>
    <div><span class="w" style="font-weight:900">Aa</span><span class="cap">900</span></div>
  </div>
</body>
</html>
