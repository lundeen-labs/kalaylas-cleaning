<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Slate" subtitle="Faintly teal-cool grays. Friendly, never clinical." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); }
  .ramp { display: flex; gap: 6px; padding: 18px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 62px; border-radius: 12px; border: 1px solid rgba(10,59,58,0.07); }
  .meta { display: flex; flex-direction: column; gap: 1px; }
  .tok { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw"><div class="chip" style="background:var(--neutral-0)"></div><div class="meta"><span class="tok">0</span><span class="hex">#FFFFFF</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-50)"></div><div class="meta"><span class="tok">50</span><span class="hex">#F7F9F8</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-100)"></div><div class="meta"><span class="tok">100</span><span class="hex">#EEF2F1</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-200)"></div><div class="meta"><span class="tok">200</span><span class="hex">#E1E7E6</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-300)"></div><div class="meta"><span class="tok">300</span><span class="hex">#CDD6D4</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-400)"></div><div class="meta"><span class="tok">400</span><span class="hex">#A7B3B1</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-500)"></div><div class="meta"><span class="tok">500</span><span class="hex">#7E8E8B</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-600)"></div><div class="meta"><span class="tok">600</span><span class="hex">#5C6B69</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-700)"></div><div class="meta"><span class="tok">700</span><span class="hex">#3F4D4B</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-800)"></div><div class="meta"><span class="tok">800</span><span class="hex">#283533</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><span class="tok">ink</span><span class="hex">#0C1817</span></div></div>
  </div>
</body>
</html>
