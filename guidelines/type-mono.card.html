<!-- @dsCard group="Type" viewport="700x150" name="Mono — Spline Sans Mono" subtitle="Eyebrows, labels, prices — the small technical voice." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px 24px; display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 8px; }
  .eyebrow { font-family: var(--font-mono); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-strong); }
  .label { font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .06em; color: var(--text-muted); }
  .price { font-family: var(--font-mono); font-weight: 600; font-size: 34px; letter-spacing: -0.01em; color: var(--text-heading); }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .div { width: 1px; align-self: stretch; background: var(--border-subtle); }
</style>
</head>
<body>
  <div class="item">
    <span class="eyebrow">Residential Cleaning</span>
    <span class="label">Serving Skagit Valley</span>
    <span class="cap">UPPERCASE · tracking 0.16em</span>
  </div>
  <div class="div"></div>
  <div class="item">
    <span class="price">$129</span>
    <span class="cap">tabular figures · from / per visit</span>
  </div>
  <div class="div"></div>
  <div class="item">
    <span class="label" style="font-size:13px">MON–SAT · 8–6</span>
    <span class="label" style="font-size:13px">(360) 555-0142</span>
    <span class="cap">labels &amp; technical detail</span>
  </div>
</body>
</html>
